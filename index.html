<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akhil Ratan Misra</title>
  <meta name="description" content="Akhil Ratan Misra — personal website. Under construction." />
  <style>
    :root {
      --ink: #111111;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 520px;
    }
    .crane {
      width: 120px;
      height: 120px;
      margin: 0 auto 28px;
      display: block;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: 0.01em;
      margin: 0 0 10px;
    }
    p {
      font-size: 1rem;
      color: #555;
      margin: 0;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <!-- Construction crane icon -->
    <svg class="crane" viewBox="0 0 100 100" fill="none" stroke="#111111" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Construction crane">
      <!-- horizontal jib -->
      <line x1="12" y1="24" x2="88" y2="24" />
      <!-- mast (vertical tower) -->
      <line x1="46" y1="24" x2="46" y2="86" />
      <line x1="54" y1="24" x2="54" y2="86" />
      <!-- tower cross-bracing -->
      <path d="M46 38 L54 50 M54 38 L46 50 M46 62 L54 74 M54 62 L46 74" stroke-width="2" />
      <!-- counter-jib support / tie bars from top of mast to jib -->
      <path d="M50 24 L50 14 M50 14 L20 24 M50 14 L80 24" stroke-width="2" />
      <!-- trolley + hoist line + hook -->
      <line x1="24" y1="24" x2="24" y2="40" />
      <path d="M21 40 h6 M24 40 v4 a3 3 0 1 0 3 0" stroke-width="2" />
      <!-- base -->
      <path d="M38 86 L62 86 M42 86 L36 94 M58 86 L64 94" />
    </svg>
    <h1>Under Construction</h1>
    <p>Something is being built here.</p>
  </main>
</body>
</html>
